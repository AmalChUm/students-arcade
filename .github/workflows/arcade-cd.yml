# The name displayed in the GitHub Actions tab.
name: Arcade CD

on:
  # Deliver changes that reach main.
  push:
    branches: [main]

  # Allow manual delivery.
  workflow_dispatch:

jobs:
  package-arcade:
    name: Package Students Arcade
    runs-on: ubuntu-latest

    steps:
      # Download repository files.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Install Python before verification.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Check syntax without executing files.
      - name: Check Python syntax
        run: python -m compileall -q .

      # Verify the launcher and save its output.
      - name: Verify the Arcade launcher
        run: timeout 20s python main.py > run-log.txt

      # Copy release files and remove Python caches.
      - name: Prepare release folder
        run: |
          mkdir -p arcade-release/plugins
          cp main.py README.md run-log.txt arcade-release/
          cp -r plugins/. arcade-release/plugins/
          find arcade-release -type d -name __pycache__ -prune -exec rm -rf {} +
          find arcade-release -type f -name '*.py[co]' -delete
          if [ -f requirements.txt ]; then cp requirements.txt arcade-release/; fi

      # Compress the release directory.
      - name: Create release ZIP
        run: zip -r students-arcade-release.zip arcade-release

      # Make the ZIP downloadable from the run.
      - name: Upload Arcade artifact
        uses: actions/upload-artifact@v4
        with:
          name: students-arcade-release
          path: students-arcade-release.zip
